version: '3.8'

services:
  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
      - ./links.db:/app/links.db
      - ./media.db:/app/media.db
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - redis
    working_dir: /app

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -c "PYTHONPATH=. celery -A app.tasks worker --loglevel=info"
    volumes:
      - .:/app
      - ./links.db:/app/links.db
      - ./media.db:/app/media.db
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    depends_on:
      - redis
      - app # Depends on app to ensure it's built, though not strictly for runtime
    working_dir: /app

volumes:
  redis_data:
